name: Staging CI/CD Pipeline

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: 1. CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-compliant:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + atomic coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Validate OpenAPI spec exists
        run: |
          test -f openapi.yaml || (echo "openapi.yaml não encontrado" && exit 1)
          echo "OpenAPI spec encontrado ($(wc -l < openapi.yaml) lines)"

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-staging
          path: coverage.out

  lint-migrations:
    name: 2. Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List migration files
        run: |
          echo "Arquivos de migração encontrados:"
          ls -la internal/app/migrations/*.sql || true

      - name: Check migration SQL syntax
        run: |
          for f in internal/app/migrations/*.sql; do
            echo "Validando: $f"
            # Verifica que o arquivo não está vazio
            test -s "$f" || (echo "ERRO: $f está vazio" && exit 1)
            # Verifica que não há DROP TABLE sem IF EXISTS em migrations incrementais
            if [[ "$f" != *"reset"* ]]; then
              grep -i "DROP TABLE" "$f" | grep -v "IF EXISTS" && \
                echo "ERRO: $f contém DROP TABLE sem IF EXISTS" && exit 1 || true
            fi
          done
          echo "Todas as migrations são válidas."

  build-image:
    name: 3. Build Docker Image
    needs: [lint-and-test, lint-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.staging
          tags: beer-avaliation-api:${{ github.sha }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Verify image builds
        run: |
          docker images beer-avaliation-api:${{ github.sha }}
          echo "Imagem Docker construída com sucesso."

  deploy-staging:
    name: 4. Deploy to Staging
    needs: build-image
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy via SSH
        run: |
          echo "Conectando ao servidor de staging..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'REMOTE_EOF'
            set -e
            echo "=== DEPLOY STAGING ==="
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"

            cd /opt/staging/beer-avaliation-api || {
              echo "ERRO: Diretório de staging não encontrado em /opt/staging/beer-avaliation-api"
              echo "Configure o diretório no servidor ou ajuste o caminho."
              exit 1
            }

            git fetch origin
            git checkout staging
            git reset --hard HEAD

            echo "Parando containers antigos..."
            docker compose -f docker-compose.staging.yaml down || true

            echo "Atualizando imagem..."
            docker compose -f docker-compose.staging.yaml build

            echo "Subindo serviços..."
            docker compose -f docker-compose.staging.yaml up -d

            echo "Aguardando saúde do PostgreSQL..."
            for i in {1..30}; do
              if docker compose -f docker-compose.staging.yaml exec -T postgres pg_isready -U postgres 2>/dev/null; then
                echo "PostgreSQL saudável."
                break
              fi
              echo "Aguardando PostgreSQL... $i/30"
              sleep 3
            done

            echo "=== DEPLOY CONCLUÍDO ==="
          REMOTE_EOF

  smoke-tests:
    name: 5. Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Wait for API
        run: |
          URL="${{ vars.STAGING_API_URL || 'http://localhost:8082' }}"
          echo "URL do staging: $URL"
          for i in {1..30}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/v1/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "API saudável."
              exit 0
            fi
            echo "Tentativa $i/30 — HTTP $CODE"
            sleep 5
          done
          echo "ERRO: API não respondeu em tempo hábil."
          exit 1

      - name: Health check
        run: |
          URL="${{ vars.STAGING_API_URL || 'http://localhost:8082' }}"
          curl -sf "$URL/api/v1/health" | python3 -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='healthy', 'Status: '+str(d['status']); print('Health:', d['status'], '| Uptime:', d['uptime'])"

      - name: Public endpoints
        run: |
          URL="${{ vars.STAGING_API_URL || 'http://localhost:8082' }}"
          for ep in /api/v1/stats /api/v1/beers/enums /api/v1/beers /docs /docs/openapi.yaml; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$ep")
            if [ "$CODE" != "200" ]; then
              echo "ERRO: GET $ep retornou $CODE"
              exit 1
            fi
            echo "✓ GET $ep — 200"
          done

      - name: Register + login flow
        run: |
          URL="${{ vars.STAGING_API_URL || 'http://localhost:8082' }}"
          EMAIL="ci-test-$(date +%s)@staging.example.com"

          REG=$(curl -sf -X POST "$URL/api/v1/users/register" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"ci-test\",\"email\":\"$EMAIL\",\"password\":\"testpass123\"}")
          echo "Register: $REG"

          LOGIN=$(curl -sf -X POST "$URL/api/v1/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"testpass123\"}")
          echo "Login: $LOGIN"

          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          if [ -z "$TOKEN" ]; then
            echo "ERRO: Token não retornado no login"
            exit 1
          fi
          echo "✓ Auth fluxo OK"

  rollback:
    name: 6. Rollback
    needs: [deploy-staging, smoke-tests]
    if: failure()
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Rollback deployment
        run: |
          echo "Falha detectada — iniciando rollback..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'REMOTE_EOF'
            set -e
            cd /opt/staging/beer-avaliation-api
            echo "Revertendo para commit anterior..."
            git reset --hard HEAD~1 || true
            docker compose -f docker-compose.staging.yaml up -d --force-recreate
            echo "Rollback concluído."
          REMOTE_EOF
