name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.5', 'stable']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # go mod tidy valida que go.mod/go.sum estão consistentes com o código.
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-compliant:"
            echo "$unformatted"
            exit 1
          fi

      # go vet: análise estática nativa (Pilar 1 — Zero-Dependency).
      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race garante a Pilar 3 (concorrência sem race conditions).
      - name: Test (race + atomic coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage HTML
        if: matrix.go == '1.26.5'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML
        if: matrix.go == '1.26.5'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage.html

      - name: Upload coverage profile
        if: matrix.go == '1.26.5'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      # Defense-in-Depth (Pilar 4): varre vulnerabilidades conhecidas nas
      # dependências diretas e transitivas sem instalar binários externos.
      - name: Govulncheck
        if: matrix.go == '1.26.5'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
