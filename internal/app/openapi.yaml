openapi: 3.0.3
info:
  title: Beer Avaliation API
  version: 1.0.0
  description: >
    API REST para gestão de cervejas, avaliações e utilizadores.
    Conformidade: RFC 7807 (Problem Details), RFC 9111 (ETag/Cache),
    RFC 7578 (multipart upload), RFC 6749 (OAuth2/OIDC), RFC 9562 (UUIDv7).

servers: []

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable (database down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/stats:
    get:
      summary: Public statistics (total beers + top styles)
      security: []
      responses:
        '200':
          description: Statistics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/admin/stats:
    get:
      summary: Admin statistics panel (requires admin role)
      responses:
        '200':
          description: Full admin analytics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/me/stats:
    get:
      summary: Authenticated user personal statistics
      responses:
        '200':
          description: User personal stats payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers:
    get:
      summary: List beers with pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: fields
          description: Comma-separated field projection (e.g. id,name,imageUrl)
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of beers
          headers:
            ETag:
              description: ETag forte derivado do conteúdo da página (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control curto (RFC 9111)
              schema:
                type: string
            Link:
              description: >
                Web Linking (RFC 8288) para paginação.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'
        '304':
          description: Not Modified (RFC 9111)
          headers:
            ETag:
              schema:
                type: string
    post:
      summary: Create a beer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
      responses:
        '201':
          description: Beer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict — similar beer already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers/enums:
    get:
      summary: Domain enum values allowlist
      security: []
      responses:
        '200':
          description: Enum allowlist
          headers:
            ETag:
              description: ETag forte derivado do conteúdo (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control longo (~1h, RFC 9111)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumsResponse'
        '304':
          description: Not Modified (RFC 9111)

  /api/v1/beers/search:
    get:
      summary: Search beers by filters
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Termo de busca em linguagem natural (FTS). Aspas para frases exatas, - para exclusão.
        - in: query
          name: fuzzy
          schema:
            type: boolean
            default: true
          description: Ativa fallback por similaridade (pg_trgm) quando FTS retornar zero resultados.
        - in: query
          name: style
          schema:
            type: string
        - in: query
          name: taste
          schema:
            type: string
        - in: query
          name: aroma
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'

  /api/v1/beers/{id}:
    get:
      summary: Get a beer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Beer details
          headers:
            ETag:
              description: ETag forte derivado de updated_at (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control (RFC 9111)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '304':
          description: Not Modified (RFC 9111)
        '404':
          description: Beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      summary: Update a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
      responses:
        '200':
          description: Beer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Beer deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers/{id}/media:
    post:
      summary: Upload beer image (RFC 7578 Multipart Form Data)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem (JPEG, PNG ou WebP), máx 10MB
      responses:
        '200':
          description: Media updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner/admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers/{id}/comments:
    post:
      summary: Add a comment to a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '400':
          description: Invalid comment payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner/admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Content rejected by moderation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: commentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Comment deleted
        '404':
          description: Comment or beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/beers/{id}/comments/{commentId}/like:
    post:
      summary: Like a comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: commentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '404':
          description: Comment or beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid registration payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/login:
    post:
      summary: Login a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginInput'
      responses:
        '200':
          description: Login successful — returns JWT HS256 session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: "JWT HS256 de sessão (usar em Authorization: Bearer <token>)"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/oauth:
    post:
      summary: OAuth2/OIDC social login (RFC 6749)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - id_token
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                id_token:
                  type: string
                  description: JWT RS256 emitido pelo IdP (Google/Apple)
      responses:
        '200':
          description: OAuth login successful — returns app session JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT HS256 de sessão
        '400':
          description: Unsupported provider or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Invalid or expired id_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/{id}:
    get:
      summary: Get user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User profile
          headers:
            ETag:
              description: ETag forte derivado de updated_at (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control (RFC 9111)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '304':
          description: Not Modified (RFC 9111)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      summary: Update user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      summary: Delete user account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User account deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden (not owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/{id}/push/subscribe:
    post:
      summary: Subscribe to push notifications
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '201':
          description: Push subscription created
        '400':
          description: Invalid subscription payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/{id}/push/unsubscribe:
    post:
      summary: Unsubscribe from push notifications
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '204':
          description: Push subscription removed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/users/{id}/push:
    get:
      summary: List push subscriptions for user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of push subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushSubscription'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: "URI do erro (ex: /errors/unauthorized)"
        title:
          type: string
          description: Resumo legível (HTTP status text)
        status:
          type: integer
          description: HTTP status code
        code:
          type: string
          description: Chave i18n estável snake_case para o cliente
        detail:
          type: string
          description: Mensagem fallback (não expõe causa interna)
        instance:
          type: string
          description: Caminho da requisição que falhou
        trace_id:
          type: string
          description: ID de correlação (RequestIDMiddleware)
        details:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetail'
        action:
          $ref: '#/components/schemas/ProblemAction'

    ProblemDetail:
      type: object
      required:
        - code
      properties:
        field:
          type: string
          description: Campo do payload que falhou
        code:
          type: string
          description: "Código do erro do campo (ex: email_invalid)"
        detail:
          type: string
          description: Mensagem legível do campo (i18n no cliente)

    ProblemAction:
      type: object
      properties:
        type:
          type: string
          description: "Tipo de ação sugerida (ex: relogin, retry)"
        uri:
          type: string
          description: URI ou deep link para a ação
        meta:
          type: object
          additionalProperties: true
          description: Metadados adicionais para a UX

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        uptime:
          type: string
        dependencies:
          type: object
          additionalProperties:
            type: string

    MemoryStats:
      type: object
    StatsResponse:
      type: object
      properties:
        totalBeers:
          type: integer
        topStyles:
          type: array
          items:
            $ref: '#/components/schemas/StyleCount'

    AdminStatsResponse:
      type: object
      required:
        - generated_at
        - users
        - beers
        - engagement
        - system
      properties:
        generated_at:
          type: string
          format: date-time
        users:
          $ref: '#/components/schemas/AdminUsers'
        beers:
          $ref: '#/components/schemas/AdminBeers'
        engagement:
          $ref: '#/components/schemas/AdminEngagement'
        system:
          $ref: '#/components/schemas/AdminSystem'

    AdminUsers:
      type: object
      properties:
        total:
          type: integer
        new_this_week:
          type: integer
        by_provider:
          type: object
          additionalProperties:
            type: integer
        admins_count:
          type: integer

    AdminBeers:
      type: object
      properties:
        total:
          type: integer
        top_styles:
          type: array
          items:
            $ref: '#/components/schemas/StyleCount'
        added_last_30_days:
          type: integer
        community_contributions:
          $ref: '#/components/schemas/CommunityBeerStats'

    CommunityBeerStats:
      type: object
      properties:
        user_created:
          type: integer
        system_created:
          type: integer

    AdminEngagement:
      type: object
      properties:
        total_comments:
          type: integer
        sentiment:
          $ref: '#/components/schemas/SentimentStats'
        total_likes:
          type: integer
        most_commented_beer:
          $ref: '#/components/schemas/MostCommentedBeer'

    SentimentStats:
      type: object
      properties:
        positive:
          type: integer
        negative:
          type: integer
        satisfaction_rate:
          type: number
          format: float

    MostCommentedBeer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comments:
          type: integer

    AdminSystem:
      type: object
      properties:
        last_beer_created_at:
          type: string
          format: date-time
        last_db_update:
          type: string
          format: date-time

    UserStatsResponse:
      type: object
      required:
        - user_id
        - member_since
        - activity
        - preferences
        - contributions
      properties:
        user_id:
          type: string
          format: uuid
        member_since:
          type: string
          format: date-time
        activity:
          $ref: '#/components/schemas/UserActivity'
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        contributions:
          $ref: '#/components/schemas/UserContributions'

    UserActivity:
      type: object
      properties:
        beers_reviewed:
          type: integer
        total_comments:
          type: integer
        likes_given:
          type: integer
        likes_received:
          type: integer

    UserPreferences:
      type: object
      properties:
        positive_rating_ratio:
          type: number
          format: float
        favorite_styles:
          type: array
          items:
            $ref: '#/components/schemas/StyleCount'
        top_aroma_notes:
          type: string

    UserContributions:
      type: object
      properties:
        beers_added_to_catalog:
          type: integer

    StyleCount:
      type: object
      properties:
        style:
          type: string
        count:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        provider:
          type: string
          enum: [local, google, apple]
        external_sub:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

    Beer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        style:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
        alcohol:
          type: number
          format: float
        taste:
          type: string
        aroma:
          type: string
        color:
          type: string
        body:
          type: string
        carbonation:
          type: string
        finish:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        averageRating:
          type: number
