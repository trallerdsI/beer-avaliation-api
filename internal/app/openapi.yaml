openapi: 3.0.3
info:
  title: Beer Avaliation API
  version: 1.1.0
  description: >
    API de rede social de cerveja. A cerveja é o "post" do feed; o feed é a
    listagem de cervejas e as interações (comentários com nota, likes) orbitam
    à volta dela. Visualização é pública; criar cerveja, comentar e dar like
    exigem login (Bearer JWT).
  x-sync: Fiel ao código (internal/app/app.go + modelos). Manter alinhado a cada mudança de contrato.
servers:
  - url: https://beer-avaliation-api.vercel.app
  - url: http://localhost:8082
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Database unavailable

  /api/v1/beers:
    get:
      summary: List beers (feed global / catálogo) with pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: fields
          schema:
            type: string
          description: "Projeção de campos separados por vírgula (ex id,name,imageUrl,averageRating)"
      responses:
        '200':
          description: Paginated list of beers (with aggregates)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'
    post:
      summary: Create a beer (requires auth)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
      responses:
        '201':
          description: Beer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '400':
          description: Invalid request payload (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate beer detected (name collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateBeerError'

  /api/v1/beers/search:
    get:
      summary: Search beers by filters (used to suggest existing beers before creating)
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: style
          schema:
            type: string
        - in: query
          name: taste
          schema:
            type: string
        - in: query
          name: aroma
          schema:
            type: string
        - in: query
          name: minAlcohol
          schema:
            type: number
        - in: query
          name: maxAlcohol
          schema:
            type: number
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'

  /api/v1/beers/{id}:
    get:
      summary: Get a beer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Beer details (includes comments + aggregates)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '404':
          description: Beer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a beer (requires auth; owner or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
      responses:
        '200':
          description: Beer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '401':
          description: Unauthorized
        '403':
          description: Not allowed to update this beer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Beer not found
    delete:
      summary: Delete a beer (requires auth; owner or admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Beer deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Not allowed to delete this beer
        '404':
          description: Beer not found

  /api/v1/beers/{id}/comments:
    post:
      summary: Add a comment + rating to a beer (requires auth)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '200':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentCreated'
        '400':
          description: Invalid input (text empty or rating out of 1-5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Beer not found

  /api/v1/beers/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment (requires auth; author or beer owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Not allowed to delete this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment or beer not found

  /api/v1/beers/{id}/comments/{commentId}/like:
    post:
      summary: Toggle like on a comment (requires auth)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment liked (idempotent by user; second call removes)
        '401':
          description: Unauthorized
        '400':
          description: Already liked (should not normally happen with toggle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Comment or beer not found

  /api/v1/users/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistered'
        '400':
          description: Invalid registration payload

  /api/v1/users/login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginInput'
      responses:
        '200':
          description: Login successful (returns JWT token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistered'
        '401':
          description: Invalid credentials

  /api/v1/users/{id}:
    get:
      summary: Get user profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
    put:
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: User profile updated
    delete:
      summary: Delete user account
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User account deleted

  /api/v1/stats:
    get:
      summary: Get monitoring statistics
      responses:
        '200':
          description: Statistics payload

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Beer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        style:
          type: string
          description: Opcional (iniciante pode omitir)
        description:
          type: string
        imageUrl:
          type: string
          description: Apenas HTTPS (validado no backend)
        alcohol:
          type: number
          minimum: 0
          maximum: 100
        taste:
          type: string
          description: Opcional (enum de sabor)
        aroma:
          type: string
        color:
          type: string
        body:
          type: string
        carbonation:
          type: string
        finish:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        createdBy:
          type: string
          description: user_id do criador (AuthZ)
        createdAt:
          type: string
          format: date-time
          description: Timestamp ISO8601 de criação (ordenação do feed)
        averageRating:
          type: number
          format: float
          description: Média dos ratings dos comentários (calculado)
        totalReviews:
          type: integer
          description: Nº de comentários com rating (calculado)
    BeerInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        style:
          type: string
          description: Opcional
        description:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          description: Opcional, apenas HTTPS
        alcohol:
          type: number
          minimum: 0
          maximum: 100
        taste:
          type: string
          description: Opcional
        aroma:
          type: string
        color:
          type: string
        body:
          type: string
        carbonation:
          type: string
        finish:
          type: string
    Comment:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
          maxLength: 2000
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Nota individual do utilizador (1-5)
        likes:
          type: integer
        likedBy:
          type: array
          items:
            type: string
          description: user_ids que deram like
        createdBy:
          type: string
          description: user_id do autor (AuthZ)
        createdAt:
          type: string
          format: date-time
    CommentInput:
      type: object
      required:
        - text
        - rating
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Obrigatório (1-5)
    CommentCreated:
      type: object
      properties:
        message:
          type: string
        commentId:
          type: string
    BeerListResponse:
      type: object
      properties:
        beers:
          type: array
          items:
            $ref: '#/components/schemas/Beer'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: "Código de erro estável para o cliente (ex: DUPLICATE_BEER)"
        detail:
          type: string
          description: Payload extra seguro (nunca expõe causa interna/DB)
    DuplicateBeerError:
      type: object
      properties:
        error:
          type: string
          example: Uma cerveja com nome semelhante já existe
        code:
          type: string
          example: DUPLICATE_BEER
        suggestions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: "12"
              name:
                type: string
                example: Heineken Long Neck
    UserRegisterInput:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        name:
          type: string
    UserLoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UserRegistered:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT Bearer token
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            role:
              type: string
    UserUpdateInput:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
