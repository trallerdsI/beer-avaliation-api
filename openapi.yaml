openapi: 3.0.3
info:
  title: Beer Avaliation API
  version: 1.0.0
  description: Complete API for managing beers, beer comments, users, and basic statistics.
servers:
  - url: https://beer-avaliation-api.vercel.app
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Database unavailable

  /api/v1/beers:
    get:
      summary: List beers with pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
        - in: query
          name: fields
          description: Comma-separated field projection (e.g. id,name,imageUrl)
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of beers
          headers:
            ETag:
              description: ETag forte derivado do conteúdo da página (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control curto (RFC 9111)
              schema:
                type: string
            Link:
              description: >
                Web Linking (RFC 8288) para paginação. Contém rel="first",
                rel="prev", rel="next", rel="last" com a URL absoluta da
                coleção e os parâmetros de página corretos. Ausente quando não
                aplicável (ex.: sem página seguinte).
              schema:
                type: string
                example: '<https://beer-avaliation-api.vercel.app/api/v1/beers?page=2&pageSize=10>; rel="next", <https://beer-avaliation-api.vercel.app/api/v1/beers?page=5&pageSize=10>; rel="last"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'
        '304':
          description: Not Modified — cliente pode reutilizar o cache (RFC 9111)
    post:
      summary: Create a beer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
            example:
              name: Fumaçônica Double IPA
              style: Imperial IPA
              alcohol: 8.5
              brewery: Fumaçônica
              taste: Amargo
              aroma: Cítrico
              color: Âmbar
              body: Médio
              carbonation: Alta
              finish: Seco
      responses:
        '201':
          description: Beer created successfully (idempotência via nome+estilo únicos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '400':
          description: Invalid request payload (RFC 7807)
        '409':
          description: >
            Conflito de similaridade — uma cerveja com nome/estilo muito
            próximo já existe no catálogo (prevenção de fragmentação).
            Devolve sugestões para o cliente direcionar o utilizador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Uma cerveja similar já existe no catálogo.
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
              example:
                error: Uma cerveja similar já existe no catálogo.
                suggestions:
                  - id: uuid-1
                    name: Fumaçônica IPA

  /api/v1/beers/enums:
    get:
      summary: Domain enum values (allowlist) for the mobile client
      description: >
        Returns the allowlist of valid enum values (style, taste, aroma, color,
        body, carbonation, finish). The backend is the source of truth; the
        Flutter app consumes this list and does not accept free user input.
      responses:
        '200':
          description: Enum allowlist
          headers:
            ETag:
              description: ETag forte derivado do conteúdo (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control longo (~1h, RFC 9111)
              schema:
                type: string
        '304':
          description: Not Modified — cliente pode reutilizar o cache (RFC 9111)

  /api/v1/beers/{id}/media:
    post:
      summary: Upload de imagem da cerveja (RFC 7578 Multipart Form Data)
      description: >
        Recebe um ficheiro de imagem via multipart/form-data (campo 'file'),
        valida por magic bytes (JPEG/PNG/WebP), faz upload para o object
        storage (Supabase Storage) e anexa a URL à cerveja (coluna media JSONB).
        AuthZ: só o criador ou um admin podem anexar.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem (JPEG, PNG ou WebP), máx 10MB
      responses:
        '200':
          description: Mídias da cerveja atualizadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
        '415':
          description: Tipo de mídia não suportado
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (não é o dono/admin)

  /api/v1/beers/search:
    get:
      summary: Search beers by filters
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: style
          schema:
            type: string
        - in: query
          name: taste
          schema:
            type: string
        - in: query
          name: aroma
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeerListResponse'

  /api/v1/beers/{id}:
    get:
      summary: Get a beer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Beer details
          headers:
            ETag:
              description: ETag forte derivado de updated_at (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control (RFC 9111)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beer'
        '304':
          description: Not Modified — cliente pode reutilizar o cache (RFC 9111)
        '404':
          description: Beer not found
    put:
      summary: Update a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeerInput'
      responses:
        '200':
          description: Beer updated successfully
        '404':
          description: Beer not found
    delete:
      summary: Delete a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Beer deleted successfully
        '404':
          description: Beer not found

  /api/v1/beers/{id}/comments:
    post:
      summary: Add a comment to a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comment added successfully
        '404':
          description: Beer not found

  /api/v1/beers/{id}/comments/{commentId}:
    delete:
      summary: Delete a comment from a beer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted successfully
        '404':
          description: Comment or beer not found

  /api/v1/beers/{id}/comments/{commentId}/like:
    post:
      summary: Like a comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment liked successfully
        '404':
          description: Comment or beer not found

  /api/v1/users/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterInput'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid registration payload

  /api/v1/users/login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginInput'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /api/v1/users/oauth:
    post:
      summary: Login social OAuth2/OIDC (RFC 6749)
      description: >
        Recebe o `id_token` (JWT RS256) de um IdP configurado (Google/Apple).
        A API valida assinatura e claims (iss/aud/exp/alg=RS256) contra o JWKS
        do provedor, faz upsert do utilizador e devolve o JWT HS256 de sessão
        da aplicação. Sem providers configurados, responde 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                id_token:
                  type: string
      responses:
        '200':
          description: OAuth login successful — returns app session JWT
        '400':
          description: Unsupported provider or invalid body
        '401':
          description: Invalid or expired id_token (RFC 7807)

  /api/v1/users/{id}:
    get:
      summary: Get user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          headers:
            ETag:
              description: ETag forte derivado de updated_at (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control (RFC 9111)
              schema:
                type: string
        '304':
          description: Not Modified — cliente pode reutilizar o cache (RFC 9111)
        '401':
          description: Unauthorized
    put:
      summary: Update user profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: User profile updated
    delete:
      summary: Delete user account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User account deleted

  /api/v1/stats:
    get:
      summary: Get monitoring statistics
      responses:
        '200':
          description: Statistics payload

  /api/v1/feed:
    get:
      summary: BFF home feed (single payload for mobile home screen)
      description: >
        Consolidates the home screen into a single request, returning a lean
        projection of beers (no long descriptions or full comments array).
        Supports field selection via the `fields` query parameter
        (comma-separated JSON field names).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: fields
          in: query
          description: Comma-separated field projection (e.g. id,name,imageUrl)
          schema:
            type: string
      responses:
        '200':
          description: Home feed payload
          headers:
            ETag:
              description: ETag forte derivado do conteúdo do feed (RFC 9111)
              schema:
                type: string
            Cache-Control:
              description: Cache-Control curto (RFC 9111)
              schema:
                type: string
            Link:
              description: >
                Web Linking (RFC 8288) para paginação do feed (rel="first",
                rel="prev", rel="next", rel="last"). Mesma semântica de
                /api/v1/beers.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeFeed'
        '304':
          description: Not Modified — cliente pode reutilizar o cache (RFC 9111)

  /api/v1/stream:
    get:
      summary: Server-Sent Events real-time stream
      description: >
        Persistent SSE stream that pushes domain events (beer.created,
        comment.added, comment.deleted, comment.liked) to mobile clients,
        replacing polling. Closes automatically when the client disconnects.
      responses:
        '200':
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Link:
      description: >
        Web Linking (RFC 8288). Em coleções paginadas (/api/v1/beers,
        /api/v1/feed) contém rel="first", rel="prev", rel="next", rel="last".
      schema:
        type: string
    ETag:
      description: ETag forte (RFC 9111) para validação de cache por versão/conteúdo.
      schema:
        type: string
  parameters:
    corsOrigin:
      name: Origin
      in: header
      required: false
      description: Origem da requisição (CORS). Validada contra CORS_ALLOWED_ORIGINS / CORS_ALLOWED_REGEX.
      schema:
        type: string
  schemas:
    Beer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 (RFC 9562), time-ordered. Não sequencial — evita enumeração.
        name:
          type: string
        style:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        alcohol:
          type: number
        taste:
          type: string
        aroma:
          type: string
        color:
          type: string
        body:
          type: string
        carbonation:
          type: string
        finish:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    BeerInput:
      type: object
      required:
        - name
        - style
        - taste
        - aroma
        - color
        - body
        - carbonation
        - finish
      properties:
        name:
          type: string
        style:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        alcohol:
          type: number
        taste:
          type: string
        aroma:
          type: string
        color:
          type: string
        body:
          type: string
        carbonation:
          type: string
        finish:
          type: string
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 (RFC 9562).
        text:
          type: string
        likes:
          type: integer
        likedBy:
          type: array
          items:
            type: string
        positive:
          type: boolean
    CommentInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        positive:
          type: boolean
    BeerListResponse:
      type: object
      properties:
        beers:
          type: array
          items:
            $ref: '#/components/schemas/Beer'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    HomeFeed:
      type: object
      properties:
        featured:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    FeedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 (RFC 9562).
        name:
          type: string
        style:
          type: string
        imageUrl:
          type: string
        alcohol:
          type: number
        commentCount:
          type: integer
    SSEEvent:
      type: object
      properties:
        type:
          type: string
          description: Event name (beer.created, comment.added, comment.deleted, comment.liked)
        id:
          type: string
          format: uuid
          description: UUIDv7 (RFC 9562) do recurso afetado.
        data:
          type: object
          description: Event-specific payload
    UserRegisterInput:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UserLoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UserUpdateInput:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    MediaItem:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL da imagem no object storage (https)
        type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          description: Tamanho do ficheiro em bytes
