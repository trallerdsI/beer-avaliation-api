openapi: 3.1.0
info:
  title: Beer Review API
  description: API for managing beer reviews, comments, and users
  version: 1.0.0

servers:
  - url: http://localhost:8082/api/v1
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    DeviceID:
      type: apiKey
      in: header
      name: X-Device-ID

  schemas:
    User:
      type: object
      properties:
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          example: password123

    Beer:
      type: object
      properties:
        name:
          type: string
          example: Test Beer
        style:
          type: string
          example: IPA
        description:
          type: string
          example: A test beer
        alcohol:
          type: number
          format: float
          example: 5.5
        taste:
          type: string
          enum: [Amargo, Doce, Azedo]
          example: Amargo
        aroma:
          type: string
          enum: [Frutado, Maltado, Floral]
          example: Frutado
        color:
          type: string
          enum: [Clara, Âmbar, Escura]
          example: Clara
        body:
          type: string
          enum: [Leve, Médio, Encorpado]
          example: Médio
        carbonation:
          type: string
          enum: [Baixa, Média, Alta]
          example: Média
        finish:
          type: string
          enum: [Seco, Semi-seco, Doce]
          example: Seco

paths:
  /users/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid input

  /users/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "401":
          description: Invalid credentials

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      summary: Update user profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Profile updated successfully
    delete:
      summary: Delete user account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account deleted successfully

  /beers:
    get:
      summary: Get all beers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of beers
    post:
      summary: Create a new beer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Beer"
      responses:
        "201":
          description: Beer created successfully

  /beers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get beer by ID
      responses:
        "200":
          description: Beer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beer"
        "404":
          description: Beer not found
    put:
      summary: Update beer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Beer"
      responses:
        "200":
          description: Beer updated successfully
        "404":
          description: Beer not found
    delete:
      summary: Delete beer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Beer deleted successfully
        "404":
          description: Beer not found

  /beers/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Add a comment to a beer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                positive:
                  type: boolean
      responses:
        "201":
          description: Comment added successfully

  /beers/{id}/comments/{commentId}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Like a comment
      security:
        - BearerAuth: []
        - DeviceID: []
      responses:
        "200":
          description: Comment liked successfully
        "400":
          description: Already liked or invalid request

  /beers/{id}/comments/{commentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Delete comment
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Comment deleted successfully
        "404":
          description: Comment not found

  /beers/search:
    get:
      summary: Search beers
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Search term
        - name: style
          in: query
          schema:
            type: string
          description: Beer style filter
        - name: minAlcohol
          in: query
          schema:
            type: number
          description: Minimum alcohol percentage
        - name: maxAlcohol
          in: query
          schema:
            type: number
          description: Maximum alcohol percentage
        - name: taste
          in: query
          schema:
            type: string
            enum: [Amargo, Doce, Azedo]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beer"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer

  /stats:
    get:
      summary: Get application statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBeers:
                    type: integer
                  totalUsers:
                    type: integer
                  totalComments:
                    type: integer
                  topBeers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beer"
                  recentActivity:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [comment, like, review]
                        userId:
                          type: string
                        beerId:
                          type: string
                        timestamp:
                          type: string
                          format: date-time

  /health:
    get:
      summary: Check API health
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                  uptime:
                    type: number
                  dependencies:
                    type: object
                    properties:
                      database:
                        type: string
                        enum: [up, down]
                      redis:
                        type: string
                        enum: [up, down]

  /metrics:
    get:
      summary: Get application metrics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
