version: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - app-network

  api:
    build: .
    environment:
      DBConnString: ${DB_CONN_STRING}
      SERVER_PORT: ${SERVER_PORT}
    depends_on:
      - postgres
    networks:
      - app-network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

networks:
  app-network:
    driver: bridge
